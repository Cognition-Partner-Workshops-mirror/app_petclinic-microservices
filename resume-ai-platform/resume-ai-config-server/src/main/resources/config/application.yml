# Shared configuration for all Resume AI Platform microservices.
# This file is served by the config server to every service.

# Eureka client settings (shared by all services)
eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

# Actuator endpoints exposed for monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

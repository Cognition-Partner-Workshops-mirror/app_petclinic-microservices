server:
  port: 8888

spring:
  application:
    name: config-server
  # Use native profile to serve config from classpath
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          search-locations: classpath:/config

# Actuator health endpoint for Docker healthcheck
management:
  endpoints:
    web:
      exposure:
        include: health,info
